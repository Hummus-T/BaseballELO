{% extends "base.html" %}
{% block title %}Register - Baseball Elo{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ACCOUNT</p><h1>Create an account</h1></div></div>
<div class="card form-card"><form method="post">
  <label for="username">Username</label><input id="username" name="username" maxlength="80" required autofocus>
  <label for="password">Password</label><input id="password" name="password" type="password" required>
  <label for="confirmation">Confirm password</label><input id="confirmation" name="confirmation" type="password" required>
  <div class="form-actions"><button class="button" type="submit">Register</button><a href="{{ url_for('login') }}">Log in</a></div>
</form></div>
{% endblock %}
