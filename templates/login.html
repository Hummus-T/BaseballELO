{% extends "base.html" %}
{% block title %}Log in - Baseball Elo{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">ACCOUNT</p><h1>Log in</h1></div></div>
<div class="card form-card"><form method="post">
  <label for="username">Username</label><input id="username" name="username" maxlength="80" required autofocus>
  <label for="password">Password</label><input id="password" name="password" type="password" required>
  <div class="form-actions"><button class="button" type="submit">Log in</button><a href="{{ url_for('register') }}">Create an account</a></div>
</form></div>
{% endblock %}
